name: Auto RSS Fetch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run RSS Script
      env: 
        RSS_JOURNALS: ${{ secrets.RSS_JOURNALS }}
        RSS_KEYWORDS: ${{ secrets.RSS_KEYWORDS }}
        RSS_FEED_TITLE: ${{ secrets.RSS_FEED_TITLE }}
        RSS_FEED_DESCRIPTION: ${{ secrets.RSS_FEED_DESCRIPTION }}
        RSS_FEED_LINK: ${{ secrets.RSS_FEED_LINK }}
        RSS_REBUILD_FROM_SCRATCH: ${{ secrets.RSS_REBUILD_FROM_SCRATCH }}
      run: python get_RSS.py

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Prepare Pages artifact
      run: |
        mkdir -p site
        cp filtered_feed.xml fetch_failures.tsv site/

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: site

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add filtered_feed.xml fetch_failures.tsv
        # 只有当有新文件生成或文件变动时才提交
        git commit -m "Auto-update RSS feed" || echo "No changes to commit"
        git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
